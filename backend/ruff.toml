line-length = 100
target-version = "py312"
extend-exclude = ["env", "migrations", "staticfiles"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "C4", "SIM"]
ignore = ["S101"]  # assert es normal en pytest

[lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"**/tests/**" = ["S105", "S106", "SIM117"]
"conftest.py" = ["S105", "S106"]

"config/settings/test.py" = ["S105", "F403", "F405"]
